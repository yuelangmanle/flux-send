name: 功能建议
description: 提出一个能改善 Flux 的具体想法。
title: "fr: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认这不是安全漏洞或重复问题。
          required: true

  - type: checkboxes
    id: duplication
    attributes:
      label: 请确认
      options:
        - label: 我已搜索过现有 Issue。
          required: true
        - label: 这是功能建议，不是可复现的 Bug。
          required: true

  - type: textarea
    id: reason
    attributes:
      label: 需求与使用场景
      description: 说明当前流程的痛点及希望改善的原因。
      placeholder: |
        Because if I want to ..., I'll need to ...
        It's not very ... to do so ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 说明希望新增或改变什么。
      placeholder: |
        If there's a choice like ..., it will be more ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 若不能采用上述方案，是否还有替代方式？
      placeholder: |
        Add a ... also helps ...

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有帮助的背景或截图。
      placeholder: |
        Related app, website, system, or a design. Anything helpful can be here.
