name: Bug 报告
description: 报告可稳定复现的问题，帮助我们修复 Flux。
title: "bug: "
labels: [bug]
body:
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除密码、Token、个人文件、完整内网地址和其他敏感信息。
          required: true

  - type: checkboxes
    id: duplication
    attributes:
      label: 请确认
      options:
        - label: 我已搜索过现有 Issue，确认没有重复报告。
          required: true
        - label: 我正在使用最新 GitHub Release，或已注明测试版本。
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚简洁地说明实际发生了什么。
      placeholder: |
        App crashes on startup every time after changing settings.
        /
        App crashes when sending/receiving massive files.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 说明你预期发生什么。
      placeholder: |
        App started normally, everything worked fine.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 给出可重复的操作步骤。
      placeholder: |
        1. Turn on "..." in "... settings"
        2. Restart the app
        3. Crash
        /
        1. Transfer a "..." file is ... size takes ... long
        2. Observe ...
        3. Crash
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 设备与连接信息
      description: 提供双方设备与网络/蓝牙模式信息，请勿填写完整 IP 或 MAC 地址。
      placeholder: |
        Device: (Pixel 9 Pro/Lenovo Yoga 9i)
        System: (Android 16 BP31.2505/Windows 11 24H2)
        Special things: (Rooted/Hardware damaged)
        If applicable, both info of sender and receiver.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或脱敏日志
      description: 如有需要可上传，注意移除个人信息。
      placeholder: |
        modified_setting_items.jpg
        files_to_send.jpg
        crashed_screen.jpg
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于定位的信息。
      placeholder: |
        Crash report or any helpful information.
    validations:
      required: false
